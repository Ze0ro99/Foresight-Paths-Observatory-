name: CI

on:
  pull_request:
    branches: [main, feat/v1-testnet-direct-mode-rebased, feat/agent-operations-workbench-testnet, feat/pi-appstudio-auth-validation]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: deno check supabase/functions/agent-workbench/index.ts supabase/functions/news-refresh/index.ts
      - name: Production build
        run: npm run build
