name: CI

on:
  pull_request:
    branches: [main, feat/v1-testnet-direct-mode-rebased]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Docker image build
        run: docker build --tag foresight-paths:ci --build-arg NEXT_PUBLIC_PI_SANDBOX_MODE=false --build-arg NEXT_PUBLIC_PI_PAYMENTS_ENABLED=false .
